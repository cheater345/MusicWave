[versions]
agp = "8.7.0"
kotlin = "2.0.21"
composeCompiler = "1.5.14"
composeBom = "2024.10.00"
activityCompose = "1.9.3"
hilt = "2.51.1"
ksp = "2.0.21-1.0.25"
serialization = "1.7.2"
coroutines = "1.8.1"
ktor = "3.0.3"
okhttp = "4.12.0"
media3 = "1.6.0"
room = "2.6.1"
datastore = "1.1.4"
work = "2.9.1"
lifecycle = "2.8.4"
viewmodel = "2.8.4"
navigation = "2.8.4"
material3 = "1.3.1"
materialIcons = "1.3.1"
coil = "2.7.0"
accompanist = "0.32.0"
shimmer = "0.6.0-alpha04"
re2j = "1.8.0"
apacheLang3 = "3.15.0"
timber = "5.0.1"
junit = "4.13.2"
turbine = "1.0.1"
desugaring = "2.0.4"
guava = "33.3.1-android"
concurrentFutures = "1.1.0"
androidsvg = "1.4"
markwon = "4.6.4"
squigglyslider = "1.0.0"
aboutlibraries = "9.1.3"
translator = "1.0.0"
kuromoji = "0.9.0"
palette = "1.0.0"
mediaRouter = "1.6.0"
glance = "1.1.1"
translatorApi = "1.0.0"

[libraries]
# Android Gradle Plugin
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
coreKtx = "1.15.0"

# AndroidX
activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.0" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version = "1.1.0" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
media3 = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
mediarouter = { group = "androidx.mediarouter", name = "mediarouter", version.ref = "mediaRouter" }
palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
glance = { group = "androidx.glance", name = "glance", version.ref = "glance" }
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeBom" }
compose-ui-util = { group = "androidx.compose.ui", name = "ui-util", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeBom" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeBom" }
compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "composeBom" }
compose-reorderable = { group = "androidx.compose.foundation", name = "foundation-layout", version.ref = "composeBom" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeBom" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeBom" }

# Hilt
hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation = { group = "androidx.hilt", name = "hilt-navigation-compose", version = "1.2.0" }

# Kotlin
kotlin-serialization = { group = "org.jetbrains.kotlin", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlin-metadata = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "serialization" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Ktor
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }

# OkHttp
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-dnsoverhttps = { group = "com.squareup.okhttp3", name = "okhttp-dnsoverhttps", version = "4.12.0" }

# Image Loading
coil = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt", name = "coil-network-okhttp", version.ref = "coil" }

# UI Components
accompanist-lyrics = { group = "com.google.accompanist", name = "accompanist-lyrics", version.ref = "accompanist" }
shimmer = { group = "com.facebook.shimmer", name = "shimmer", version.ref = "shimmer" }
squigglyslider = { group = "com.github.ppoh", name = "squigglyslider", version.ref = "squigglyslider" }
re2j = { group = "com.google.re2j", name = "re2j", version.ref = "re2j" }
apache-lang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "apacheLang3" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
aboutlibraries = { group = "com.mikepenz", name = "aboutlibraries-core", version.ref = "aboutlibraries" }
markwon-core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
markwon-ext-strikethrough = { group = "io.noties.markwon", name = "ext-strikethrough", version.ref = "markwon" }
markwon-ext-tables = { group = "io.noties.markwon", name = "ext-tables", version.ref = "markwon" }
markwon-ext-tasklist = { group = "io.noties.markwon", name = "ext-tasklist", version.ref = "markwon" }
markwon-html = { group = "io.noties.markwon", name = "html", version.ref = "markwon" }
markwon-image = { group = "io.noties.markwon", name = "image", version.ref = "markwon" }
markwon-linkify = { group = "io.noties.markwon", name = "linkify", version.ref = "markwon" }
markwon-simple-ext = { group = "io.noties.markwon", name = "simple-ext", version.ref = "markwon" }
androidsvg = { group = "com.caverock", name = "androidsvg", version.ref = "androidsvg" }

# Translation
translator = { group = "com.github.Rukamori", name = "translator", version.ref = "translator" }

# Japanese Tokenizer
kuromoji-ipadic = { group = "com.atilika.kuromoji", name = "kuromoji-ipadic", version.ref = "kuromoji" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

# Desugaring
desugaring = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugaring" }

# Guava
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
coroutines-guava = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version.ref = "coroutines" }
concurrent-futures = { group = "com.google.guava", name = "listenablefuture", version.ref = "concurrentFutures" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }